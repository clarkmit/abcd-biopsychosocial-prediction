[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "abcd-biopsychosocial-prediction"
dynamic = ["version"]
description = "High-dimensional ensemble stacking ML pipeline for hierarchical, interactive, and dynamic prediction of psychiatric, cognitive, and social outcomes in the ABCD Study"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Clark Roberts", email = "Clark001@mit.edu" }, { name = "Zhafira E. Fawnia" }]
keywords = [
  "machine-learning", "psychiatry", "abcd-study", "stacking-ensemble", "catboost",
  "xgboost", "tabpfn", "shap", "nested-cross-validation", "computational-psychiatry",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# Compatible ranges. CI tests the newest releases; paper/requirements.txt pins the versions v1.0.0 was tested with.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "catboost>=1.2",
  "xgboost>=2.0",
  "shap>=0.45",
  "imbalanced-learn>=0.12",
  "smogn>=0.1.2",
  "optuna>=3.6",
  "optuna-integration>=3.6",
  "mapie>=1.0",
  "pygam>=0.9",
  "statsmodels>=0.14",
  "networkx>=3.2",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "joblib>=1.3",
  "tqdm>=4.66",
  "ipython>=8.20",
  "pyyaml>=6.0.1",
  "jinja2>=3.1",  # pandas styled tables
]

[project.optional-dependencies]
tabpfn = ["tabpfn>=6.0", "torch>=2.2"]
notebooks = ["jupyterlab>=4.0", "ipykernel>=6.29", "ipywidgets>=8.0"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.13",
  "types-PyYAML",
  "ruff==0.17.2",  # same version as CI and pre-commit (formatting is version-specific)
  "pre-commit>=3.7",
  "nbstripout>=0.9",
]

[project.scripts]
bpsp = "bpsp.cli:main"

[project.urls]
Homepage = "https://github.com/clarkmit/abcd-biopsychosocial-prediction"
Documentation = "https://clarkmit.github.io/abcd-biopsychosocial-prediction"
Source = "https://github.com/clarkmit/abcd-biopsychosocial-prediction"
Changelog = "https://github.com/clarkmit/abcd-biopsychosocial-prediction/blob/main/CHANGELOG.md"
Archive = "https://doi.org/10.5281/zenodo.23540757"

[tool.hatch.version]
path = "src/bpsp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bpsp"]

[tool.hatch.build.targets.sdist]
include = ["src/bpsp", "README.md", "LICENSE", "CITATION.cff"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: end-to-end runs on the simulated panel (minutes)",
  "slow: equivalence tests against the published notebook (long; run on demand)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning", "ignore::FutureWarning"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["paper", "notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B006", "UP", "W"]
ignore = [
  "E402",   # stage modules keep the notebook's import placement next to the code that uses it
  "E701", "E702", "E731", "E741",
  "UP031", "UP032",  # keep original %-/format() strings in ported stage code
]

[tool.ruff.lint.per-file-ignores]
# Stage modules are a faithful port of the published notebook (v1.0.0) and keep its code as written
# (e.g. `series == True` on pandas objects is intentional); see docs/architecture.md.
"src/bpsp/{reporting.py,analysis/*.py,data/*.py,interpretation/*.py,models/*.py,reports/*.py,validation/*.py}" = [
  "F401", "F403", "F601", "F811", "F841", "B006", "E712", "E722", "UP006", "UP035",
]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["bpsp"]

# ---------------------------------------------------------------- mypy
# The hand-written modules are type-checked. The stage modules are the notebook's code and are
# checked by the integration and equivalence tests instead (docs/architecture.md).
[tool.mypy]
python_version = "3.11"
files = [
  "src/bpsp/__init__.py", "src/bpsp/_version.py", "src/bpsp/_logging.py", "src/bpsp/cli.py",
  "src/bpsp/config.py", "src/bpsp/context.py", "src/bpsp/pipeline.py", "src/bpsp/simulation.py",
]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
  "bpsp.reporting", "bpsp.analysis.*", "bpsp.data.*", "bpsp.interpretation.*",
  "bpsp.models.*", "bpsp.reports.*", "bpsp.validation.*",
]
follow_imports = "skip"

# ---------------------------------------------------------------- coverage
# Unit-test coverage is reported for the hand-written modules; the stage modules run in the
# integration and equivalence tests, which are too slow to measure on every push.
[tool.coverage.run]
source = ["bpsp"]
branch = true
omit = [
  "*/bpsp/reporting.py", "*/bpsp/analysis/*", "*/bpsp/data/*", "*/bpsp/interpretation/*",
  "*/bpsp/models/*", "*/bpsp/reports/*", "*/bpsp/validation/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
